name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "release"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build binaries and update release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/woyin/skills-manager/cmd.Version=${version}"

          mkdir -p dist

          build() {
            local goos="$1"
            local goarch="$2"
            local ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            local binary="sm${ext}"
            local base="sm_${version}_${goos}_${goarch}"

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="$ldflags" -o "dist/${binary}" .

            if [ "$goos" = "windows" ]; then
              (cd dist && zip "${base}.zip" "${binary}")
            else
              (cd dist && tar -czf "${base}.tar.gz" "${binary}")
            fi
            rm "dist/${binary}"
          }

          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          build windows arm64

          (cd dist && sha256sum * > checksums.txt)

      - name: Create or update tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          notes="Automated build for ${release_tag} from ${GITHUB_SHA}."

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" dist/* --clobber
          else
            gh release create "${release_tag}" dist/* \
              --target "$GITHUB_SHA" \
              --title "${release_tag}" \
              --notes "${notes}" \
              --latest
          fi
