name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "release"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build binaries and update release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/woyin/skills-manager/cmd.Version=${version}"

          mkdir -p dist

          build() {
            local goos="$1"
            local goarch="$2"
            local ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            local binary="sm${ext}"
            local base="sm_${version}_${goos}_${goarch}"

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="$ldflags" -o "dist/${binary}" .

            if [ "$goos" = "windows" ]; then
              (cd dist && zip "${base}.zip" "${binary}")
            else
              (cd dist && tar -czf "${base}.tar.gz" "${binary}")
            fi
            rm "dist/${binary}"
          }

          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          build windows arm64

          (cd dist && sha256sum * > checksums.txt)

      - name: Create or update tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          notes="Automated build for ${release_tag} from ${GITHUB_SHA}."

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" dist/* --clobber
          else
            gh release create "${release_tag}" dist/* \
              --target "$GITHUB_SHA" \
              --title "${release_tag}" \
              --notes "${notes}" \
              --latest
          fi

      - name: Sync Homebrew formula and move latest tag
        # 仅在推送 v* 版本 tag 时执行(workflow_dispatch 不触发,避免误改 formula)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"   # 形如 v0.2.0
          ver="${tag#v}"             # 形如 0.2.0

          # formula 更新需提交到默认分支;latest tag 也随之移动到最新提交
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/woyin/SkillsManager.git"
          git checkout -B main origin/main

          # dist/checksums.txt 是上一步 build 产生的未跟踪产物,切分支后仍保留
          python3 .github/scripts/sync_formula.py "${ver}" "${tag}" dist

          git add Formula/sm.rb
          git commit -m "chore(formula): sync to ${tag}"
          git push origin main

          # 移动 latest tag,使 install.sh 与直接拉取始终指向最新发布
          git tag -f latest
          git push origin latest --force
